name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"     # daily 03:00 UTC
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=4c6ef5&color_dots=eff0f3,a5b4fc,7aa2f7,5a67d8,3b3f66
            dist/github-snake-dark.svg?palette=github-dark&color_snake=7aa2f7&color_dots=1a1b27,3b3f66,5a67d8,7aa2f7,bb9af7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
